name: Hotel Price Watch

on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間おき(UTC基準)。必要に応じて調整
  workflow_dispatch: {}      # 手動実行用ボタン

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hotel watch
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python scripts/hotel_watch.py

      - name: Commit updated history
        run: |
          git config user.name "price-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hotel_history.json
          git diff --cached --quiet || git commit -m "update hotel price history"
          git push
